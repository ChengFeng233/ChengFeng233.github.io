title: Gengyuan Hu
first_name: Gengyuan
last_name: Hu
description: Academic homepage of Gengyuan Hu, with work on clinical multimodal evaluation and applied computer vision.
url: https://chengfeng233.github.io
baseurl: ""
lang: en
icon: monogram.svg
footer_text: >
  Built with <a href="https://jekyllrb.com/">Jekyll</a> and <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
navbar_fixed: true
footer_fixed: false
back_to_top: false
max_width: 960px
enable_darkmode: true
enable_masonry: false
enable_project_categories: false
enable_medium_zoom: false
search_enabled: false
bib_search: false
serve_og_meta: true
third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap

theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
plugins:
  - al_folio_core
  - al_citations
  - al_icons
  - al_rtl
  - jekyll-3rd-party-libraries
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-socials

include: ["_pages"]
exclude: ["README.md", "LICENSE", "Gemfile", "Gemfile.lock"]
collections:
  projects:
    output: true
    permalink: /projects/:name/

scholar:
  first_name: [Gengyuan]
  last_name: [Hu]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  group_by: year
  group_order: descending

enable_publication_thumbnails: true
filtered_bibtex_keywords: [abbr, bibtex_show, code, html, pdf, preview, selected, website]
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
